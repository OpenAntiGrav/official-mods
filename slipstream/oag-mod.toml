# Slipstream: a pickup that carries the craft through a portal to a point further along the
# circuit. A simulation mod (docs/architecture/wasm-extensions/): it runs only in a build with
# the `extensions` cargo feature, in races with weapons. Rules are in guest/src/lib.rs;
# ext/slipstream.wasm is `guest/build.sh`'s output, committed. Off until the player turns it on.

toml-schema = { location = "https://oag.topaxi.com/mods/schemas/v1/mod.tosd", version = "1.0.0" }

[mod]
id = "oag.slipstream"
name = "Slipstream"
version = "1.0.0"
authors = ["The OpenAntiGrav contributors"]
license = "MIT OR Apache-2.0"
description = "A pickup of its own: fire it where a half disc fits ahead and the craft goes through a portal, untouchable for a second, and comes out further along the circuit a little slower. One portal at a time; a second fire waits for the first."
repository = "https://github.com/OpenAntiGrav/official-mods"
titles = ["wipeout-pulse", "wipeout-pure", "wipeout-hd", "wipeout-omega-collection", "wipeout-2048"]
default-enabled = false

[extension]
simulation = true
api = 1
memory_pages = 2
# The state's length is the guest's (`Portal`), which the module exports.

[extension.rules]
module = "ext/slipstream.wasm"

# The portal's surface: the view through it, or its own animation (fx/portal.wgsl). The
# tunnel a person flies through, over their own view (fx/wormhole.wgsl). The guest names them
# by key (`SHADER_*`).
[shaders]
portal = "fx/portal.wgsl"
wormhole = "fx/wormhole.wgsl"

# One portal per title, a tinted half disc (guest `Look::of` names them by key).
[effects]
portal_2048 = "fx/portal_2048.toml"
portal_hd = "fx/portal_hd.toml"
portal_omega = "fx/portal_omega.toml"
portal_pulse = "fx/portal_pulse.toml"
portal_pure = "fx/portal_pure.toml"

# The mod's own sounds (sounds/, made by src/synth_sounds.py): a module's `play-mod-sound`
# names one by key (guest `SOUND_*`).
[sounds]
portal-exit = "sounds/portal-exit.wav"
portal-open = "sounds/portal-open.wav"
transit = "sounds/transit.wav"

# One icon per title in that title's style. Pulse's PSP and PS2 pressings are one title to a
# manifest, so they share the PS2 art (the larger, scaled down to the box). Pure's is the glyph
# alone: the engine draws Pure's striped backdrop under it.
[icons]
2048 = "icons/2048.png"
hd = "icons/hd.png"
omega = "icons/omega.png"
pulse = "icons/pulse_ps2.png"
pure = "icons/pure_psp.png"
# The glyph of the incoming warning a craft coming through behind a person raises, an SVG
# rasterised at the warning slot's pixels (the title's rear icons are all weapons').
portal-warning = "icons/portal-warning.svg"

[pickup]
icon = { mod = "pulse" }
colour = { title = "turbo" }

[pickup.titles.wipeout-pulse]
icon = { mod = "pulse" }

[pickup.titles.wipeout-pure]
icon = { mod = "pure" }

[pickup.titles.wipeout-hd]
icon = { mod = "hd" }

[pickup.titles.wipeout-omega-collection]
icon = { mod = "omega" }

[pickup.titles.wipeout-2048]
icon = { mod = "2048" }

# What the weapon pads hand it out at, beside the title's weapons, for every title and class.
# The tables are on one scale (weights sum to 86 on Pulse, about 100 on HD, Omega and 2048,
# and a Turbo is 14 to 16 of them), so one row gives a similar share everywhere: about 6 to
# 10 draws in 100, half a Turbo. Chosen, not measured.
[[pickup.odds]]
ai = 6.0
human = 6.0
front = 0.0
back = 4.0
